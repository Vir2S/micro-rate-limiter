services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AUTH_TOKEN=change-me
      - POLICY_PATH=/app/policies.json
      - LOG_LEVEL=INFO
      - KEY_PREFIX=rl
    depends_on:
      - redis
